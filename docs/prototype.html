<title>Peursum 4 Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600&family=Permanent+Marker&family=Anton&display=swap">
<style>
/* Layout: rode kop die met een rafelige rand de pagina in loopt; 3 tabs; strak raster met rode blokken als blikvanger */
:root{
  --bg:#0d0b0c; --surface:#171415; --surface-2:#221d1f; --line:#2e282a;
  --fg:#ffffff; --muted:#9d9396; --red:#e1242f; --red-deep:#a3121c;
  --win:#2fbf62; --draw:#f0b429; --loss:#e5484d;
  --f-brush:"Permanent Marker","Barlow Condensed",cursive;
  --f-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{min-height:100vh;background:
  radial-gradient(ellipse 90% 55% at 100% 100%,#5a0a1066 0%,transparent 70%),
  radial-gradient(ellipse 70% 45% at 0% 60%,#3a060b55 0%,transparent 70%),
  linear-gradient(180deg,#5c0b12 0%,#2a070a 16%,#120a0b 38%,var(--bg) 62%,#160709 100%);
  background-attachment:fixed}
.box{background:#171415f2}
body{font-family:var(--f-body);font-size:15px;line-height:1.4}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Kop: rood vlak met donkere schuine banen en een schuine onderkant, zoals het volgende-wedstrijdblok */
.head{position:relative;overflow:hidden;background:var(--red);clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),0 100%);padding-bottom:30px}
.head::before{content:"";position:absolute;top:-40px;bottom:-40px;right:8%;width:34%;background:#00000029;transform:skewX(-22deg)}
.head::after{content:"";position:absolute;top:-40px;bottom:-40px;right:calc(8% + 34% + 18px);width:5%;background:#0000001f;transform:skewX(-22deg)}
.head .wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;padding-block:20px 0;padding-inline:33px}
@media(max-width:480px){.head .wrap{padding-inline:29px}}
.brand h1{margin:0;font-family:"Anton","Barlow Condensed","Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(38px,8vw,58px);line-height:1;letter-spacing:.01em;color:#fff;display:flex;align-items:center;gap:12px;transform:skewX(-8deg);text-shadow:4px 4px 0 #0000004d}
.brand h1 .no{background:#0d0b0c;color:#fff;padding:0 .22em;line-height:1.08;box-shadow:5px 5px 0 #00000059;text-shadow:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#00000033;border:0;color:#fff;font-family:var(--f-cond);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:15px;padding:9px 16px;cursor:pointer;transform:skewX(-12deg)}
.tabs button span{display:inline-block;transform:skewX(12deg)}
.tabs button:hover{background:#00000055}
.tabs button[aria-current="page"]{background:#0d0b0c;box-shadow:4px 4px 0 #00000059}
@media(max-width:600px){.tabs{width:100%;display:grid;grid-template-columns:auto auto auto auto;gap:4px}.tabs button{padding:9px 4px;font-size:11px;letter-spacing:.02em;white-space:nowrap}}

main{margin-block:22px 24px;padding:16px;background:#0b090acc;border:1px solid #3a282b;border-top:3px solid var(--red);border-radius:4px;box-shadow:0 18px 50px #000000aa,0 0 0 1px #00000066;backdrop-filter:blur(6px)}
@media(max-width:480px){main{padding:12px}}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px;padding:8px 10px;border-left:3px solid var(--draw);background:var(--surface);color:var(--muted);font-size:13px}
.demo[hidden]{display:none!important}

/* Bouwstenen */
.box{background:var(--surface);border:1px solid var(--line);border-radius:3px;min-width:0}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.box-b{padding:12px}
.lbl{font-family:var(--f-cond);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#fff;margin:0;display:flex;align-items:center;gap:8px}
.lbl::before{content:"";width:12px;height:12px;background:var(--red);transform:skewX(-18deg)}
h2.brush{font-family:var(--f-brush);font-weight:400;font-size:28px;line-height:1;margin:6px 0 14px}
h2.brush::after{content:"";display:block;width:70px;height:6px;margin-top:6px;background:var(--red);transform:skewX(-20deg)}
.btn{font-family:var(--f-cond);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px;border:1px solid var(--line);background:var(--surface-2);color:#fff;padding:8px 14px;border-radius:2px;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red)}
.btn.primary:hover{background:var(--red-deep)}
.btn.sm{padding:4px 10px;font-size:12px}
.link{background:none;border:0;color:#fff;font-family:var(--f-cond);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.num{font-family:var(--f-cond);font-weight:800;font-variant-numeric:tabular-nums}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:780px){.grid2{grid-template-columns:1fr 1fr}}
.stack{display:grid;gap:14px;align-content:start}
.ovl{grid-template-rows:auto auto 1fr;align-content:stretch}
.ovl>.box:last-child{display:flex;flex-direction:column}
.ovl>.box:last-child .tstats{flex:1}
.ts{display:flex;flex-direction:column;justify-content:center}

/* Volgende wedstrijd (rood blok) */
.hot{background:var(--red);border-radius:3px;padding:16px;position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.hot::after{content:"";position:absolute;right:-40px;top:-30px;width:180px;height:220px;background:#00000022;transform:skewX(-20deg)}
.hot>*{position:relative;z-index:1}
.hot .k{font-family:var(--f-cond);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#ffffffd9}
.hot .opp{font-family:var(--f-cond);font-weight:900;text-transform:uppercase;font-size:clamp(26px,6vw,34px);line-height:1;margin:6px 0 4px;overflow-wrap:anywhere}
.hot .sub{font-size:13px;color:#ffffffe0}
.wdl{display:flex;height:26px;margin-top:14px;border-radius:2px;overflow:hidden;background:#00000033;font-family:var(--f-cond);font-weight:800;font-size:13px}
.wdl span{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden}
.wdl .w{background:#fff;color:var(--red-deep)}.wdl .d{background:#ffffff66;color:#fff}.wdl .l{background:#0000004d;color:#fff}
.hot .row-b{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.hot .link{color:#fff}

/* Stand */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--muted);text-align:right;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.t,td.t{text-align:left}
td.pos{color:var(--muted);font-family:var(--f-cond);font-weight:800;width:28px}
td.pts{font-family:var(--f-cond);font-weight:900;font-size:16px}
tr.us td{background:var(--red);color:#fff;font-weight:600;border-bottom-color:var(--red)}
tr.us td.pos{color:#fff}
tr.nx td{background:#ffffff0d}
tr.nx td.t::after{content:"volgende";margin-left:8px;font-family:var(--f-cond);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:800}

/* Top */
.tops{display:grid;grid-template-columns:1fr 1fr}
.top{padding:12px;min-width:0;display:flex;flex-direction:column}
.top .num{margin-top:auto;padding-top:4px}
.top+.top{border-left:1px solid var(--line)}
.top .k{font-family:var(--f-cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.top .who{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.top .num{font-size:34px;color:var(--red);line-height:1}

.tstats{display:grid;grid-template-columns:repeat(3,1fr)}
.ts{padding:12px;min-width:0}
.ts+.ts{border-left:1px solid var(--line)}
.ts .k{font-family:var(--f-cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.ts .num{font-size:30px;line-height:1.1;color:#fff}

/* Match center */
.list{display:grid}
.mrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--surface-2)}
.dd{font-family:var(--f-cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted);line-height:1.1;text-align:center}
.dd b{display:block;font-size:21px;letter-spacing:0;color:#fff}
.mopp{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:17px;overflow-wrap:anywhere}
.todo{color:var(--draw)}
.score{font-family:var(--f-cond);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;padding:2px 9px;border-radius:2px;min-width:52px;text-align:center}
.W{background:var(--win);color:#06140b}.D{background:var(--draw);color:#1c1303}.L{background:var(--loss);color:#1c0506}
.pct{font-family:var(--f-cond);font-weight:800;font-size:15px;text-align:right}
.pct small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

.day+.day{border-top:1px solid var(--line)}
.day-h{font-family:var(--f-cond);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--muted);padding:8px 12px 2px}
.prow2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 12px;width:100%;background:none;border:0;text-align:left;font-size:14px}
.prow2.ours{cursor:pointer;background:#e1242f14;border-left:3px solid var(--red)}
.prow2.ours:hover{background:#e1242f26}
.prow2 .pm{font-weight:600;overflow-wrap:anywhere}
.us-t{color:#fff;font-weight:800}
.prow2 .score{font-size:16px;min-width:46px;padding:1px 7px}

.rnd{border-bottom:1px solid var(--line)}
.rnd:last-child{border-bottom:0}
.rnd summary{list-style:none;display:grid;grid-template-columns:38px 1fr 14px;gap:12px;align-items:center;padding:10px 12px;cursor:pointer}
.rnd summary::-webkit-details-marker{display:none}
.rnd summary:hover{background:var(--surface-2)}
.rn{font-family:"Anton","Barlow Condensed",sans-serif;font-size:20px;line-height:34px;text-align:center;background:var(--surface-2);transform:skewX(-10deg);color:#fff}
.rnd[open] .rn{background:var(--red)}
.rnd.side .rn{font-size:13px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.rt{display:grid;gap:2px;min-width:0}
.rd{font-family:var(--f-cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.rl{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.rs-us{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rs-us b{font-family:var(--f-cond);font-weight:800;text-transform:uppercase;font-size:16px}
.rl .score{font-size:15px;min-width:44px;padding:1px 6px}
.rs-pct{font-family:var(--f-cond);font-weight:800;font-size:15px;white-space:nowrap}
@media(max-width:480px){.rs-pct::after{content:none}}
.rs-pct::after{content:" winkans";font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rs-tag{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--draw)}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
.rnd[open] .chev{transform:rotate(225deg);margin-top:4px}
.rnd-b{border-top:1px solid var(--line);background:#00000026}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}

.share-b{display:grid;gap:16px;grid-template-columns:minmax(0,360px) 1fr;align-items:start}
@media(max-width:640px){.share-b{grid-template-columns:1fr}}
.share-b img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#111}
.share-side{min-width:0}

/* Wedstrijddetail */
.hero{background:var(--red);border-radius:3px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:18px 14px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:44%;top:-20px;bottom:-20px;width:90px;background:#00000026;transform:skewX(-18deg)}
.hero>*{position:relative}
.hero .tm{font-family:var(--f-cond);font-weight:900;text-transform:uppercase;font-size:clamp(18px,4.6vw,28px);line-height:1;overflow-wrap:anywhere}
.hero .tm.r{text-align:right}
.hero .big{font-family:var(--f-cond);font-weight:900;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.hero .vs{font-family:var(--f-brush);font-size:30px}
.hero-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 2px 14px;font-family:var(--f-cond);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--muted)}

/* Voorspelling */
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prob{background:var(--surface-2);border-radius:2px;padding:10px;text-align:center}
.prob .num{font-size:28px;line-height:1}
.prob .k{font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--muted);margin-top:4px}
.prob.us{background:var(--red)}.prob.us .k{color:#ffffffd9}
.xg{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:14px}
.xg .side{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;font-size:13px}
.xg .side.r{text-align:right}
.xg .num{font-size:30px}
.xg .mid{font-family:var(--f-cond);letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--muted);text-align:center}
.verdict{margin-top:12px;padding:10px;border-radius:2px;background:var(--surface-2);font-size:14px}
.tag{display:inline-block;font-family:var(--f-cond);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:1px 7px;border-radius:2px;margin-right:6px}
.matrix{display:grid;grid-template-columns:auto repeat(6,1fr);gap:2px;font-variant-numeric:tabular-nums;font-size:12px}
.matrix div{padding:6px 2px;text-align:center;border-radius:2px}
.matrix .hd{font-family:var(--f-cond);font-weight:800;color:var(--muted);background:none}
.matrix .c{color:#fff}
.matrix .c.best{outline:2px solid #fff;outline-offset:-2px;font-weight:700}
.axis{display:flex;justify-content:space-between;font-family:var(--f-cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--muted);margin-bottom:6px}
.sos{display:grid;gap:4px}
.sos-row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.sos-row:last-child{border-bottom:0}
.rk{font-family:var(--f-cond);font-weight:800;text-align:center;border-radius:2px;padding:1px 0;font-size:13px}
.rk.top{background:var(--red)}.rk.mid{background:var(--surface-2)}.rk.low{background:transparent;border:1px solid var(--line);color:var(--muted)}

.fixf{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
input[type=date],input[type=time]{font:inherit;font-size:14px;color:#fff;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:6px 8px;width:100%;min-width:0}

/* Invoer */
textarea{font:inherit;font-size:14px;color:#fff;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:8px 10px;width:100%;min-height:110px;resize:vertical}
select,input[type=text]{font:inherit;font-size:14px;color:#fff;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:6px 8px;width:100%;min-width:0}
label.f{display:grid;gap:4px;font-family:var(--f-cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.chip .t{font-family:var(--f-cond);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--draw)}
.unk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;font-family:var(--f-cond);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm{min-width:0;font-weight:600;overflow-wrap:anywhere}
.prow .nm small{display:block;font-family:var(--f-cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:10px;color:var(--muted)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.step button{background:var(--surface-2);border:0;width:28px;height:30px;cursor:pointer;font-weight:700}
.step b{min-width:46px;text-align:center;font-family:var(--f-cond);font-weight:800;font-size:13px;letter-spacing:.04em;padding:0 4px}
.step.on b{color:var(--red)}
.tg{background:var(--surface-2);border:1px solid var(--line);border-radius:2px;height:32px;min-width:32px;padding:0 8px;cursor:pointer;font-family:var(--f-cond);font-weight:800;font-size:12px}
.tg[aria-pressed="true"].y{background:var(--draw);color:#1c1303;border-color:var(--draw)}
.tg[aria-pressed="true"].r{background:var(--loss);color:#1c0506;border-color:var(--loss)}
.tg[aria-pressed="true"].k{background:#fff;color:#111;border-color:#fff}
.note{margin-top:10px;padding:8px 10px;border-radius:2px;font-size:13px}
.note.warn{background:#f0b4291a;color:var(--draw)}
.note.ok{background:#2fbf621a;color:var(--win)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ev{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev:last-child{border-bottom:0}
.ci{display:inline-block;width:9px;height:12px;border-radius:1px;vertical-align:-1px}
.cy{background:var(--draw)}.cr{background:var(--loss)}
.pos-tag{font-family:var(--f-cond);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:2px;background:var(--surface-2);color:var(--muted)}
.leen{color:var(--draw)}
.foot{color:var(--muted);font-size:12px;margin-top:20px}
</style>

<header class="head">
  <div class="wrap">
    <div class="brand"><h1>Peursum <span class="no">4</span></h1></div>
    <nav class="tabs" aria-label="Schermen">
      <button type="button" data-v="home"><span>Overzicht</span></button>
      <button type="button" data-v="comp"><span>Competitie</span></button>
      <button type="button" data-v="mc"><span>Match center</span></button>
      <button type="button" data-v="spelers"><span>Team</span></button>
    </nav>
  </div>
</header>

<div class="wrap"><main>
  <div id="app"></div>
  <p class="foot">Prototype versie 1 · invoer blijft in deze browser.</p>
</main></div>

<script>
/* ================= Data van vvpeursum.nl (10 okt 2026) ================= */
const US="Peursum 4";

/* ================= Uitslagen afleiden uit wekelijkse standen =================
   Elke week wordt de poulestand opgeslagen. Elk team speelt één wedstrijd per ronde,
   dus het verschil in goals voor/tegen tussen twee weken geeft per team de score.
   Twee teams met gespiegelde scores (3-1 en 1-3) hebben tegen elkaar gespeeld.
   Bij twee gelijke uitslagen in één ronde beslist het poule-programma. */
const SNAPSHOTS=[{date:"2026-10-10",ronde:4,stand:STAND.map(r=>({team:r.team,gp:r.gp,gf:r.gf,ga:r.ga}))}];
function deriveRound(prev,cur,fixtures){
  const P=Object.fromEntries(prev.stand.map(r=>[r.team,r]));
  const d=cur.stand.filter(r=>P[r.team]&&r.gp-P[r.team].gp===1).map(r=>({team:r.team,f:r.gf-P[r.team].gf,a:r.ga-P[r.team].ga}));
  const out=[],used=new Set(),unsure=[];
  d.forEach(x=>{
    if(used.has(x.team))return;
    let c=d.filter(y=>y.team!==x.team&&!used.has(y.team)&&y.f===x.a&&y.a===x.f);
    if(c.length>1&&fixtures){c=c.filter(y=>fixtures.some(f=>(f[0]===x.team&&f[1]===y.team)||(f[1]===x.team&&f[0]===y.team)))}
    if(c.length===1){used.add(x.team);used.add(c[0].team);out.push({h:x.team,a:c[0].team,hg:x.f,ag:x.a})}else unsure.push(x.team);
  });
  return{results:out,unsure};
}
function derivedResultsDated(){
  return POULE_RESULTS.concat(snapshotResults().filter(r=>!POULE_RESULTS.some(p=>p.h===r.h&&p.a===r.a)));
}
function snapshotResults(){
  const hist=[...SNAPSHOTS,...(S.snaps||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const all=[];for(let i=1;i<hist.length;i++)all.push(...deriveRound(hist[i-1],hist[i]).results.map(r=>({...r,date:hist[i].date})));return all;
}
function derivedResults(){return derivedResultsDated()}
function roundsBox(){

    Elke speelronde slaat de app de poulestand op. Door de stand van deze week te vergelijken met die van vorige week weet de app per team de score, en welke teams tegen elkaar speelden. Zo groeit de winkans vanzelf mee, zonder iets in te voeren.

}

/* ================= Model: sterkte met correctie voor tegenstanders ================= */
function knownResults(){
  const out=MATCHES.filter(m=>played(m)&&row(m.opp)).map(m=>m.home?{h:US,a:m.opp,hg:m.us,ag:m.them}:{h:m.opp,a:US,hg:m.them,ag:m.us});
  derivedResults().forEach(r=>{if(!out.some(o=>(o.h===r.h&&o.a===r.a)||(o.h===r.a&&o.a===r.h)))out.push(r)});
  return out;
}
function fit(){
  const K=2, T=STAND.map(r=>r.team), res=knownResults();
  const mu=STAND.reduce((s,r)=>s+r.gf,0)/STAND.reduce((s,r)=>s+r.gp,0);
  const opp={};T.forEach(t=>opp[t]=[]);
  res.forEach(r=>{opp[r.h].push(r.a);opp[r.a].push(r.h)});
  let a={},d={};T.forEach(t=>{a[t]=1;d[t]=1});
  for(let it=0;it<50;it++){
    const na={},nd={};
    T.forEach(t=>{
      const r=row(t),kn=opp[t].slice(0,r.gp),unk=Math.max(0,r.gp-kn.length);
      const eF=kn.reduce((s,o)=>s+d[o],0)+unk, eA=kn.reduce((s,o)=>s+a[o],0)+unk;
      na[t]=(r.gf/mu+K)/(eF+K); nd[t]=(r.ga/mu+K)/(eA+K);
    });
    const ma=T.reduce((s,t)=>s+na[t],0)/T.length, md=T.reduce((s,t)=>s+nd[t],0)/T.length;
    T.forEach(t=>{a[t]=na[t]/ma;d[t]=nd[t]/md});
  }
  return{mu,a,d,opp};
}
const pois=(l,k)=>{let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p};
function predict(m){
  const M=fit(),H=1.1,o=m.opp;
  const lu=M.mu*M.a[US]*M.d[o]*(m.home?H:1/H), lt=M.mu*M.a[o]*M.d[US]*(m.home?1/H:H);
  let w=0,dr=0,l=0,mat=[],best={p:0};

    if(r.ours&&r.m.round){const rd=dates[r.m.round-1];add("r"+r.m.round,{key:"r"+r.m.round,n:r.m.round,date:rd,sort:rd},r);return}

    add("r"+num[d],{key:"r"+num[d],n:num[d],date:d,sort:d},r);

    ${pres.length?`<div class="prow"><div class="nm muted">Eigen goal tegenstander</div><div class="ctrls"><span class="step ${draft.og?"on":""}"><button type="button" id="ogDec" aria-label="min">−</button><b>${draft.og}</b><button type="button" id="ogInc" aria-label="plus">+</button></span></div></div>
    <div class="note ${gsum===m.us?"ok":"warn"}">${gsum} van ${m.us} goals toegewezen.</div>`:""}
  </div></section>
  <div class="actions"><button class="btn primary" type="button" id="saveE">Opslaan</button><button class="btn" type="button" id="cancelE">Annuleren</button>${S.entries[m.id]?`<button class="btn" type="button" id="delE">Wissen</button>`:""}</div>`;

function parseAttendance(txt){
  const names=txt.split(/[\n,;]+/).map(l=>l.replace(/^\s*[\d]+[.)]?\s*/,"").replace(/^[-*•·]\s*/,"").replace(/\(.*?\)/g,"").replace(/[^\p{L}\s'.-]/gu,"").trim()).filter(n=>n.length>1);
  const found=[],newOnes=[];
  names.forEach(n=>{
    const k=norm(n);
    const hit=S.players.find(p=>norm(p.name)===k)||S.players.find(p=>{const pn=norm(p.name).split(" ");const kn=k.split(" ");return kn.length>1&&pn[0]===kn[0]&&pn[pn.length-1]===kn[kn.length-1]})||(k.split(" ").length===1?S.players.filter(p=>norm(p.name).split(" ")[0]===k).length===1&&S.players.find(p=>norm(p.name).split(" ")[0]===k):null);
    if(hit)found.push(hit.id);else if(!newOnes.some(u=>norm(u.name)===k))newOnes.push({name:n.replace(/\s+/g," "),type:"leen"});
  });
  return{found,newOnes};
}

/* ================= Render en events ================= */
const VIEWS={home:vHome,comp:vComp,mc:vNext,spelers:vSpelers};
function render(){
  if(!VIEWS[S.view])S.view="home";
  $("#app").innerHTML=VIEWS[S.view]();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===S.view?"page":"false"));
}
function go(view,mc){S.view=view;S.mc=mc||null;editing=false;fixEdit=false;draft=null;unknown=[];save();render();window.scrollTo(0,0)}
$(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)});
const ST=id=>(draft.st[id]=draft.st[id]||{});
$("#app").addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.rename){const p=P(d.rename);if(p&&t.value.trim()){p.name=t.value.trim();save();render()}return}
  if(d.pos){const p=P(d.pos);if(p){p.pos=t.value;save()}return}
});
$("#app").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.go)return go(d.go);
  if(d.open)return go("comp",d.open);
  if(t.id==="back")return go("comp");
  if(t.id==="shareOpen")return openShare();
  if(t.id==="shareClose"){$("#shareBox").hidden=true;$("#shareOpen").hidden=false;return}
  if(t.id==="shareSave")return saveShare();
  if(t.id==="editFix"){fixEdit=true;return render()}
  if(t.id==="cancelFix"){fixEdit=false;return render()}
  if(t.id==="addFix"){const id="x"+Date.now().toString(36);const last=MATCHES.filter(m=>!played(m)&&m.date).pop();const nd=last?new Date(new Date(last.date+"T12:00").getTime()+7*864e5).toISOString().slice(0,10):"";S.extra=(S.extra||[]).concat([{id,date:nd,time:"12:30",opp:"",home:true,type:"Competitie"}]);save();applyFixtures();S.mc=id;fixEdit=true;return render()}
  if(t.id==="saveFix"){
    const v={opp:$("#fxOpp").value.trim()||"Onbekend",date:$("#fxDate").value||null,time:$("#fxTime").value,home:$("#fxHome").value==="1",type:$("#fxType").value,venue:$("#fxVenue").value.trim()};
    const ex=(S.extra||[]).find(x=>x.id===S.mc);
    if(ex)Object.assign(ex,v);else{S.fix=S.fix||{};S.fix[S.mc]=v}
    fixEdit=false;save();applyFixtures();return render()}
  if(t.id==="delFix"){S.extra=(S.extra||[]).filter(x=>x.id!==S.mc);save();applyFixtures();return go("comp")}
  if(t.id==="resetFix"){delete S.fix[S.mc];fixEdit=false;save();applyFixtures();return render()}
  if(t.id==="edit"){editing=true;draft=null;return render()}
  if(t.id==="cancelE"){editing=false;draft=null;unknown=[];return render()}
  if(t.id==="attGo"){const r=parseAttendance($("#attIn").value);r.found.forEach(id=>{if(!draft.present.includes(id))draft.present.push(id)});unknown=r.newOnes;return render()}
  if(d.ut){const[i,ty]=d.ut.split("|");unknown[+i].type=ty;return render()}
  if(t.id==="unkOk"){unknown.forEach(u=>{const id="x"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);S.players.push({id,name:u.name,pos:"Middenvelder",type:u.type});draft.present.push(id)});unknown=[];save();return render()}
  if(d.pres){const i=draft.present.indexOf(d.pres);if(i>=0){draft.present.splice(i,1);delete draft.st[d.pres];if(draft.keeper===d.pres)draft.keeper=""}else draft.present.push(d.pres);return render()}
  if(d.inc){const[id,k]=d.inc.split("|");ST(id)[k]=(ST(id)[k]||0)+1;return render()}
  if(d.dec){const[id,k]=d.dec.split("|");ST(id)[k]=Math.max(0,(ST(id)[k]||0)-1);return render()}
  if(d.tg){const[id,k]=d.tg.split("|");ST(id)[k]=!ST(id)[k];if(k==="r"&&ST(id).r)ST(id).y=false;return render()}
  if(d.kp){draft.keeper=draft.keeper===d.kp?"":d.kp;return render()}
  if(t.id==="ogInc"){draft.og++;return render()}
  if(t.id==="ogDec"){draft.og=Math.max(0,draft.og-1);return render()}
  if(t.id==="saveE"){const{mid,...e}=draft;S.entries[mid]=e;editing=false;draft=null;save();return render()}
  if(t.id==="delE"){delete S.entries[S.mc];editing=false;draft=null;save();return render()}
  if(d.promote){const p=P(d.promote);if(p){p.type="vast";save()}return render()}
  if(d.del){
    if(d.armed){S.players=S.players.filter(p=>p.id!==d.del);save();return render()}
    d.armed="1";t.textContent="Zeker?";setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent="×"}},3000);
  }
});
$("#app").addEventListener("toggle",e=>{const d=e.target;if(!d.dataset||!d.dataset.rk)return;const k=d.dataset.rk;S.openR=(S.openR||[]).filter(x=>x!==k);if(d.open)S.openR.push(k);save()},true);
$("#app").addEventListener("submit",e=>{
  if(e.target.id!=="addP")return;e.preventDefault();
  const name=$("#newName").value.trim();if(!name)return;
  S.players.push({id:"v"+Date.now().toString(36),name,pos:$("#newPos").value,type:"vast"});save();render();
});
applyFixtures();
render();

</script>
